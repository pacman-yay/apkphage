# APKPhage — single-command pipeline for everyone.
#
# Mirrors run_analysis.sh 1:1 so behavior is identical to the script:
#   static analyzer  -> apk-analyzer  (built from ./Dockerfile, --network none)
#   samples          -> ./samples  read-only input
#   results          -> ./work      read-write output (report.json, captures)
#   GROQ_API_KEY     -> from the host env (never written into the repo)
#
# Usage (as the operator, from a fresh clone):
#   export GROQ_API_KEY=<your-key>
#   docker compose up --build
#   # reports land in ./work/<SampleName>/report.json
#
# Stop after the run (it is --rm, so no state is kept):
#   Ctrl-C   (or: docker compose down)
services:
  apk-analyzer:
    build:
      context: src/apkphage
      dockerfile: Dockerfile
    image: apkphage-analyzer:local
    container_name: apk-analyzer
    network_mode: none                 # static only: no network interface at all
    volumes:
      - ./samples:/app/samples:ro      # input, read-only — matches run_analysis.sh
      - ./work:/app/work               # output — report.json, captures, evidence
    environment:
      # Value comes from the host shell on `up`; not stored in this file.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
