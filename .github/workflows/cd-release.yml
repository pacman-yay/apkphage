name: cd-release

# This pipeline triggers automatically whenever you publish a new Release on GitHub,
# or when you push a Git tag starting with "v" (e.g., v2.0.0).
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build binaries for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: apkphage
            zip_name: apkphage-linux-x64.zip
          - os: windows-latest
            artifact_name: apkphage.exe
            zip_name: apkphage-windows-x64.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Standalone Executable (PyInstaller)
        run: |
          pyinstaller --onefile --name apkphage cli.py

      - name: Package Release ZIP (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir release_bundle
          cp dist/apkphage release_bundle/
          cp Dockerfile release_bundle/
          cp Dockerfile.sandbox release_bundle/
          cp sandbox_start.sh release_bundle/
          cp -r dynamic release_bundle/
          cd release_bundle
          zip -r ../${{ matrix.zip_name }} .

      - name: Package Release ZIP (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir release_bundle
          copy dist\apkphage.exe release_bundle\
          copy Dockerfile release_bundle\
          copy Dockerfile.sandbox release_bundle\
          copy sandbox_start.sh release_bundle\
          xcopy dynamic release_bundle\dynamic\ /E /I
          Compress-Archive -Path release_bundle\* -DestinationPath ${{ matrix.zip_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
