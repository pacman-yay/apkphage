name: cd-pypi

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    
    # We highly recommend using PyPI's Trusted Publishers mechanism
    # (OIDC) instead of hardcoding tokens!
    permissions:
      id-token: write
      contents: read
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tool (hatchling)
        run: python -m pip install --upgrade pip build

      - name: Build Wheel and SDist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # To test the workflow without actually publishing, you can use TestPyPI:
        # with:
        #   repository-url: https://test.pypi.org/legacy/
